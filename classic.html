<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070606">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="塔罗牌在线占卜 —— 写下你的问题，抽一张牌，得到针对这个问题的解读。">
<meta property="og:title" content="塔罗占卜 · 抽一张牌">
<meta property="og:description" content="写下你的问题，抽一张牌，得到针对这个问题的解读。">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

<title>塔罗占卜 · 抽一张牌</title>
<style>
:root{
  --bg:#070606;
  --cream:#e9e1d5;
  --cream-2:#c9c0b2;
  --muted:#877f74;
  --muted-2:#5f5951;
  --gold:#e0bf6b;
  --gold-hot:#fff7ae;
  --gold-deep:#96762f;
  --line:rgba(224,191,107,.22);
  --line-soft:rgba(233,225,213,.11);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Times New Roman",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--sans);
  color:var(--cream);
  background:
    radial-gradient(120% 65% at 50% 0%, #191510 0%, transparent 58%),
    radial-gradient(110% 55% at 50% 100%, #141210 0%, transparent 62%),
    var(--bg);
  background-attachment:fixed;
  min-height:100dvh;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}

/* ---------- 星座背景 ---------- */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ---------- 布局 ---------- */
.app{
  position:relative;z-index:1;
  width:100%;max-width:430px;margin:0 auto;
  min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 94px);
}

/* ---------- 顶栏 ---------- */
.topbar{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  min-height:36px;
}
.brand{
  display:flex;align-items:center;gap:7px;
  font-family:var(--serif);font-size:13px;letter-spacing:.24em;
  color:var(--cream-2);
}
.brand .spark{color:var(--gold);font-size:12px}
.icon-btn{
  width:36px;height:36px;border-radius:50%;
  border:1px solid var(--line-soft);background:transparent;
  color:var(--cream-2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:.22s;
}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- 问题 ---------- */
.question{
  margin:2px 0 0;
  font-family:var(--serif);
  font-size:clamp(16px,4.6vw,18.5px);
  line-height:1.7;letter-spacing:.06em;
  color:var(--cream);
  text-align:center;
  min-height:2.6em;
  display:flex;align-items:center;justify-content:center;
  padding:0 4px;
  word-break:break-word;
}
.question.idle{color:var(--muted-2);font-size:clamp(14px,4.1vw,16px);letter-spacing:.14em}

/* ---------- 牌 ---------- */
.stage{perspective:1500px;perspective-origin:50% 35%;padding:2px 0}
.card{
  position:relative;
  width:min(66vw,252px);
  aspect-ratio:3/4.15;
  transform-style:preserve-3d;
  transition:transform 1s cubic-bezier(.2,.86,.24,1);
  will-change:transform;
}
.card.flipped{transform:rotateY(180deg)}
.card.shuffling{animation:shuffle .68s ease-in-out}
@keyframes shuffle{
  0%{transform:rotate(0) translateY(0)}
  18%{transform:rotate(-6deg) translateY(-9px)}
  42%{transform:rotate(5deg) translateY(5px)}
  68%{transform:rotate(-3.5deg) translateY(-3px)}
  100%{transform:rotate(0) translateY(0)}
}
.face{
  position:absolute;inset:0;border-radius:19px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--line);
  box-shadow:0 26px 64px rgba(0,0,0,.8), 0 0 0 1px rgba(224,191,107,.05) inset;
}

/* 牌背：曼陀罗纹样 + 金色四角星 */
.back{
  background:
    radial-gradient(58% 42% at 50% 44%, rgba(224,191,107,.11), transparent 72%),
    linear-gradient(170deg,#100e0c,#070606);
  display:flex;align-items:center;justify-content:center;
}
.mandala{
  position:absolute;inset:9%;border-radius:50%;
  background:
    repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(201,192,178,.20) 0deg 2deg, transparent 2deg 10.5deg),
    repeating-radial-gradient(circle at 50% 50%,
      rgba(201,192,178,.13) 0 1px, transparent 1px 7.5px);
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 20%, transparent 67%);
  mask-image:radial-gradient(circle at 50% 50%, #000 20%, transparent 67%);
  animation:spin 110s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.spark-svg{
  position:relative;
  width:46%;height:auto;
  filter:drop-shadow(0 0 18px rgba(255,247,174,.55)) drop-shadow(0 0 40px rgba(224,191,107,.3));
  animation:pulse 4.2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.86;transform:scale(1)}50%{opacity:1;transform:scale(1.055)}}

/* 牌面：答案写在牌里 */
.front{
  transform:rotateY(180deg);
  background:
    radial-gradient(72% 44% at 50% 6%, rgba(224,191,107,.10), transparent 68%),
    linear-gradient(180deg,#121110,#090807);
  display:flex;align-items:center;justify-content:center;
  padding:22px 18px;
}
.front-inner{
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;text-align:center;
  transition:transform .55s ease;
}
/* 逆位：不旋转内容（保证答案可读），改用紫色描边 + 内发光区分 */
.card.is-rev .front{
  border-color:rgba(170,140,255,.42);
  box-shadow:0 26px 64px rgba(0,0,0,.8), 0 0 30px rgba(150,110,255,.15) inset;
}
.front-inner.rev .card-spark{opacity:.7}
.front-inner.rev .card-name{color:#d9c8ff}
.card-spark{width:19px;height:19px;opacity:.9;
  filter:drop-shadow(0 0 10px rgba(255,247,174,.6))}
.card-orient{
  font-family:var(--sans);font-size:10px;letter-spacing:.3em;
  color:var(--gold);text-transform:uppercase;
}
.card-orient.rev{color:#c9b4ff}
.card-name{
  font-family:var(--serif);font-size:clamp(15px,4.4vw,17px);
  letter-spacing:.14em;color:var(--gold-hot);
}
.card-rule{
  width:34px;height:1px;margin:2px 0;
  background:linear-gradient(90deg,transparent,var(--line),transparent);
}
.card-answer{
  margin:0;
  font-family:var(--serif);
  font-size:clamp(13.5px,4vw,15.5px);
  line-height:1.92;letter-spacing:.045em;
  color:var(--cream);
  padding:0 2px;
}
.card-topic{
  margin-top:2px;
  font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;
  color:var(--muted);
}

/* ---------- 牌外说明 ---------- */
.caption{
  margin:0;font-family:var(--serif);
  font-size:12.5px;line-height:1.75;letter-spacing:.05em;
  color:var(--muted);text-align:center;
  max-width:300px;padding:0 4px;
  min-height:0;
}
.caption .k{color:var(--cream-2)}
.meta{
  margin:0;font-size:10.5px;letter-spacing:.1em;color:var(--muted-2);
  text-align:center;
}

/* ---------- 胶囊按钮 ---------- */
.pill{
  font-family:var(--serif);
  font-size:13.5px;letter-spacing:.26em;
  color:var(--cream-2);
  background:transparent;
  border:1px solid var(--line);
  border-radius:999px;
  padding:12px 30px;min-height:46px;
  cursor:pointer;
  transition:border-color .25s, color .25s, transform .12s;
  text-indent:.26em;
}
.pill:active{transform:scale(.97)}
.pill:disabled{opacity:.45}
.pill:hover{border-color:rgba(224,191,107,.5);color:var(--gold)}

/* ---------- 话题 chips ---------- */
.topic-hint{
  margin:0;font-size:10.5px;letter-spacing:.1em;color:var(--muted-2);
  text-align:center;min-height:1.4em;
}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:330px}
.chip{
  font-family:var(--sans);font-size:11.5px;letter-spacing:.05em;
  color:var(--muted);background:transparent;
  border:1px solid var(--line-soft);border-radius:999px;
  padding:0 11px;min-height:30px;cursor:pointer;
  display:inline-flex;align-items:center;gap:3px;
  transition:color .2s, border-color .2s, background .2s;
}
.chip.on{
  color:var(--gold);border-color:rgba(224,191,107,.55);
  background:rgba(224,191,107,.08);
}
.chip:active{transform:scale(.95)}

/* ---------- 底部输入条 ---------- */
.composer{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  width:min(calc(100% - 36px), 394px);
  z-index:15;
  display:flex;align-items:center;gap:9px;
  padding:5px 5px 5px 18px;
  border-radius:999px;
  border:1px solid var(--line-soft);
  background:rgba(10,9,8,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 8px 28px rgba(0,0,0,.62);
}
.composer input{
  flex:1;min-width:0;
  border:none;background:transparent;outline:none;
  font-family:var(--serif);font-size:16px;letter-spacing:.04em;
  color:var(--cream);padding:12px 0;
}
.composer input::placeholder{color:var(--muted-2);letter-spacing:.06em}
.send{
  width:42px;height:42px;flex:0 0 42px;
  border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(180deg,var(--gold-hot),var(--gold));
  color:#241a08;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 18px rgba(224,191,107,.3);
  transition:transform .12s;
}
.send:active{transform:scale(.92)}
.send:disabled{opacity:.5;box-shadow:none}
.send svg{width:17px;height:17px;fill:currentColor}

/* ---------- 安装提示条 ---------- */
.install{
  position:fixed;left:14px;right:14px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 88px);
  z-index:20;
  display:flex;align-items:center;gap:8px;
  padding:12px 10px 12px 15px;
  border-radius:15px;
  border:1px solid var(--line);
  background:rgba(14,12,10,.96);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 12px 34px rgba(0,0,0,.7);
  animation:rise .45s ease both;
}
.install[hidden]{display:none}
.install-txt{flex:1;font-family:var(--serif);font-size:12.5px;line-height:1.6;color:var(--cream-2)}
.install-btn{
  font-family:var(--sans);font-size:12.5px;font-weight:600;color:#241a08;
  border:none;border-radius:9px;padding:9px 14px;min-height:36px;
  cursor:pointer;white-space:nowrap;
  background:linear-gradient(180deg,var(--gold-hot),var(--gold));
}
.install-btn[hidden]{display:none}
.install-x{
  background:transparent;border:none;color:var(--muted-2);
  font-size:14px;padding:6px 8px;cursor:pointer;line-height:1;
}

/* ---------- 提示气泡 ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);
  transform:translateX(-50%) translateY(10px);
  z-index:30;
  padding:9px 18px;border-radius:999px;
  background:rgba(224,191,107,.94);color:#241a08;
  font-size:12.5px;letter-spacing:.06em;
  opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  .card{transition:transform .01ms}
}
@media (max-height:700px){
  .card{width:min(56vw,206px)}
  .question{min-height:2.2em}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<div class="app">
  <!-- 顶栏 -->
  <div class="topbar">
    <div class="brand"><span class="spark">✦</span>塔罗占卜</div>
    <button class="icon-btn" id="share" aria-label="分享">
      <svg viewBox="0 0 24 24"><path d="M12 16V4M12 4l-4 4M12 4l4 4M5 14v5a1 1 0 001 1h12a1 1 0 001-1v-5"/></svg>
    </button>
  </div>

  <!-- 问题 -->
  <p class="question idle" id="question">在心里默念你的问题</p>

  <!-- 牌 -->
  <div class="stage">
    <div class="card" id="card">
      <div class="face back">
        <div class="mandala"></div>
        <svg class="spark-svg" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <radialGradient id="sg" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fffdf0"/>
              <stop offset="42%" stop-color="#fff7ae"/>
              <stop offset="100%" stop-color="#d8b055"/>
            </radialGradient>
          </defs>
          <path fill="url(#sg)" d="M50,1 C52.4,29.6 70.4,47.6 99,50 C70.4,52.4 52.4,70.4 50,99 C47.6,70.4 29.6,52.4 1,50 C29.6,47.6 47.6,29.6 50,1 Z"/>
        </svg>
      </div>

      <div class="face front">
        <div class="front-inner" id="frontInner">
          <svg class="card-spark" viewBox="0 0 100 100" aria-hidden="true">
            <path fill="#e0bf6b" d="M50,1 C52.4,29.6 70.4,47.6 99,50 C70.4,52.4 52.4,70.4 50,99 C47.6,70.4 29.6,52.4 1,50 C29.6,47.6 47.6,29.6 50,1 Z"/>
          </svg>
          <div class="card-orient" id="cardOrient">正位</div>
          <div class="card-name" id="cardName">愚者 · The Fool</div>
          <div class="card-rule"></div>
          <p class="card-answer" id="cardAnswer">带着好奇心出发，不必等万事俱备。</p>
          <div class="card-topic" id="cardTopic">✨ 通用</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 牌外说明 -->
  <p class="caption" id="caption"></p>
  <p class="meta" id="meta"></p>

  <button class="pill" id="again">抽 一 张 牌</button>

  <p class="topic-hint" id="topicHint">这个问题属于…（自动识别，可手动改）</p>
  <div class="chips" id="topics" role="group" aria-label="问题话题"></div>

  <!-- 底部输入 -->
  <div class="composer">
    <input id="q" type="text" inputmode="text" autocomplete="off"
           placeholder="写下你的问题…" aria-label="你的问题">
    <button class="send" id="draw" aria-label="抽牌">
      <svg viewBox="0 0 24 24"><path d="M12 2.6c.5 6 4.3 9.4 10 10-5.7.6-9.5 4-10 10-.5-6-4.3-9.4-10-10 5.7-.6 9.5-4 10-10z"/></svg>
    </button>
  </div>
</div>

<div class="install" id="install" hidden>
  <span class="install-txt" id="installTxt"></span>
  <button class="install-btn" id="installBtn" hidden>安装</button>
  <button class="install-x" id="installX" aria-label="关闭提示">✕</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1. 大阿卡纳 22 张 —— 提供牌名与通用牌意
   ========================================================= */
var DECK = [
  {n:0, name:'愚者', en:'The Fool', kw:'新的开始',
   up:'带着好奇心出发，不必等万事俱备。', rev:'冲得太快容易踩空，先看清脚下。'},
  {n:1, name:'魔术师', en:'The Magician', kw:'能力具足',

  {n:7, name:'战车', en:'The Chariot', kw:'意志突破',

  {n:8, name:'力量', en:'Strength', kw:'以柔克刚',

  {n:12, name:'倒吊人', en:'The Hanged Man', kw:'换个角度',
   up:'现在不是推进的时候，停下反而有路。', rev:'无谓的牺牲和拖延，该放下了。'},

   up:'有件事该画句号了，之后是新生。', rev:'明知该结束却还在硬撑。'},
  {n:14, name:'节制', en:'Temperance', kw:'平衡调和',
   up:'不偏不倚，慢慢调和出好结果。', rev:'用力过猛或太极端，把节奏调回来。'},
  {n:15, name:'恶魔', en:'The Devil', kw:'诱惑束缚',
   up:'短期甜头，代价不小，小心被拿捏。', rev:'你正在挣脱束缚，坚持住。'},
  {n:16, name:'高塔', en:'The Tower', kw:'突变冲击',
   up:'一次突然的崩塌，清掉本就不稳的东西。', rev:'危机在缓解，但根源还没修好。'},
  {n:17, name:'星星', en:'The Star', kw:'希望重燃',
   up:'最坏的时候过去了，愿望有实现的可能。', rev:'期待落空，重新校准愿望。'},
  {n:18, name:'月亮', en:'The Moon', kw:'迷雾未散',

  {n:19, name:'太阳', en:'The Sun', kw:'大吉光明',
   up:'极好的一张牌，成功、快乐、坦荡。', rev:'结果仍然好，只是比想的慢。'},
  {n:20, name:'审判', en:'Judgement', kw:'觉醒召唤',
   up:'做个总结，接受结果，重新出发。', rev:'还没原谅自己，或不敢面对评判。'},
  {n:21, name:'世界', en:'The World', kw:'圆满达成',
   up:'一个阶段完美收官，完整实现。', rev:'很接近了，别在收尾时松劲。'}
];

var REVERSED_RATE = 0.35;

/* =========================================================
   2. 话题答案库 —— 每个话题各有独立的「正位库」「逆位库」
   ========================================================= */
var TOPICS = {

/* =========================================================
   3. 星座背景（还原参考图的连线星域）
   ========================================================= */
(function constellations(){
  var cv = document.getElementById('sky');
  var ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, stars = [], links = [];
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function build(){
    stars = [];
    var area = (W / dpr) * (H / dpr);
    var n = Math.max(26, Math.min(Math.round(area / 11000), 64));
    for (var i = 0; i < n; i++){
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: (Math.random() * 1.0 + 0.45) * dpr,
        ph: Math.random() * Math.PI * 2,
        sp: 0.5 + Math.random() * 1.1
      });
    }
    /* 找出足够近的星，连成星座线 */
    links = [];
    var maxD = 132 * dpr;
    for (var a = 0; a < stars.length; a++){
      for (var b = a + 1; b < stars.length; b++){
        var dx = stars[a].x - stars[b].x, dy = stars[a].y - stars[b].y;
        if (Math.hypot(dx, dy) < maxD) links.push([a, b]);
      }
    }
    if (links.length > 46) links = links.slice(0, 46);
  }

  function resize(){
    W = cv.width  = Math.floor(window.innerWidth  * dpr);
    H = cv.height = Math.floor(window.innerHeight * dpr);
    cv.style.width  = window.innerWidth + 'px';
    cv.style.height = window.innerHeight + 'px';
    build();
    render(performance.now());
  }

  function render(t){
    ctx.clearRect(0, 0, W, H);

    /* 星座连线 */
    ctx.lineWidth = Math.max(1, 0.6 * dpr);
    for (var i = 0; i < links.length; i++){
      var s1 = stars[links[i][0]], s2 = stars[links[i][1]];
      var d = Math.hypot(s1.x - s2.x, s1.y - s2.y) / (132 * dpr);
      ctx.strokeStyle = 'rgba(201,192,178,' + (0.075 * (1 - d)).toFixed(3) + ')';
      ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
    }

    /* 星点 */
    for (var j = 0; j < stars.length; j++){
      var s = stars[j];
      var tw = reduce ? 0.75 : (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t / 1400 * s.sp + s.ph)));
      ctx.fillStyle = 'rgba(255,252,240,' + tw.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  var raf = null, last = 0;
  function loop(t){
    raf = requestAnimationFrame(loop);
    if (t - last < 66) return;          /* 限到约 15fps，省电 */
    last = t;
    render(t);
  }

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ if (raf) cancelAnimationFrame(raf), raf = null; }
    else if (!reduce && !raf){ raf = requestAnimationFrame(loop); }
  });

  resize();
  if (!reduce) raf = requestAnimationFrame(loop);
})();

/* =========================================================
   4. 元素
   ========================================================= */
var $ = function(id){ return document.getElementById(id); };
var card = $('card'), frontInner = $('frontInner'), input = $('q');
var btnDraw = $('draw'), btnAgain = $('again');
var topicsEl = $('topics'), topicHint = $('topicHint');
var questionEl = $('question');
var currentTopic = 'general';
var manualTopic = false;
var busy = false;

/* =========================================================
   5. 问题 → 话题 识别
   ========================================================= */
var TOPIC_ORDER = ['love','career','study','money','social','health','general'];

function detectTopic(q){
  if (!q) return {topic:'general', hits:0};
  var best = 'general', bestScore = 0, bestHits = 0;
  for (var i = 0; i < TOPIC_ORDER.length; i++){
    var key = TOPIC_ORDER[i];
    if (key === 'general') continue;
    var words = TOPICS[key].keys, score = 0, hits = 0;
    for (var j = 0; j < words.length; j++){
      if (q.indexOf(words[j]) >= 0){ score += words[j].length; hits++; }
    }
    if (score > bestScore){ bestScore = score; best = key; bestHits = hits; }
  }
  return {topic:best, hits:bestHits};
}

/* =========================================================
   6. 话题 chips
   ========================================================= */
function buildChips(){
  for (var i = 0; i < TOPIC_ORDER.length; i++){
    (function(key){
      var t = TOPICS[key];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.setAttribute('data-topic', key);
      b.innerHTML = t.icon + ' ' + t.label;
      b.addEventListener('click', function(){
        manualTopic = true;
        setTopic(key, true);
        if (navigator.vibrate){ try { navigator.vibrate(8); } catch(e){} }
      });
      topicsEl.appendChild(b);
    })(TOPIC_ORDER[i]);
  }
}

function setTopic(key, manual){
  currentTopic = key;
  var chips = topicsEl.querySelectorAll('.chip');
  for (var i = 0; i < chips.length; i++){
    if (chips[i].getAttribute('data-topic') === key) chips[i].classList.add('on');
    else chips[i].classList.remove('on');
  }
  if (manual) topicHint.textContent = '已选：' + TOPICS[key].label + '（点其他可切换）';
}

/* 输入时：更新顶部问题 + 自动识别话题 */
function onInput(){
  var q = input.value.trim();
  if (q){ questionEl.textContent = q; questionEl.classList.remove('idle'); }
  else { questionEl.textContent = '在心里默念你的问题'; questionEl.classList.add('idle'); }

  if (manualTopic) return;
  var r = detectTopic(q);
  if (r.hits > 0){
    setTopic(r.topic, false);
    topicHint.textContent = '识别到「' + TOPICS[r.topic].label + '」· 不对可手动改';
  } else {
    setTopic('general', false);
    topicHint.textContent = q ? '没识别出话题，用「通用」· 也可手动选'
                              : '这个问题属于…（自动识别，可手动改）';
  }
}

input.addEventListener('input', onInput);
input.addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ input.blur(); draw(); }
});

/* =========================================================
   7. 抽牌
   ========================================================= */
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function draw(){
  if (busy) return;
  busy = true;
  btnDraw.disabled = true;

  var q = input.value.trim();

  if (!manualTopic){
    var det = detectTopic(q);
    setTopic(det.topic, false);
    if (det.hits > 0) topicHint.textContent = '识别到「' + TOPICS[det.topic].label + '」· 不对可手动改';
  }

  var topic = TOPICS[currentTopic];
  var c = DECK[Math.floor(Math.random() * DECK.length)];
  var reversed = Math.random() < REVERSED_RATE;
  var bank = reversed ? topic.rev : topic.up;
  var answer = pick(bank);

  card.classList.remove('flipped');
  card.classList.remove('is-rev');
  frontInner.classList.remove('rev');
  card.classList.add('shuffling');
  if (navigator.vibrate){ try { navigator.vibrate(12); } catch(e){} }

  setTimeout(function(){
    /* 牌面：卡名 + 正逆位 + 本次答案 */
    $('cardOrient').textContent = reversed ? '逆位' : '正位';
    $('cardOrient').className = 'card-orient' + (reversed ? ' rev' : '');
    $('cardName').textContent = c.name + ' · ' + c.en;
    $('cardAnswer').textContent = answer;
    $('cardTopic').textContent = topic.icon + ' ' + topic.label;
    if (reversed){
      frontInner.classList.add('rev');
      card.classList.add('is-rev');
    }

    /* 牌外：牌意 + 来源 */
    $('caption').innerHTML = '<span class="k">牌意</span> · ' + (reversed ? c.rev : c.up);
    $('meta').textContent = '从「' + topic.label + ' · ' + (reversed ? '逆位' : '正位') +
                            '」答案库的 ' + bank.length + ' 条中随机抽取';

    btnAgain.textContent = '再 抽 一 张';
    card.classList.remove('shuffling');
    card.classList.add('flipped');

    setTimeout(function(){
      busy = false;
      btnDraw.disabled = false;
    }, 620);
  }, 700);
}

btnDraw.addEventListener('click', draw);
btnAgain.addEventListener('click', draw);

/* =========================================================
   8. 分享 / 复制链接
   ========================================================= */
$('share').addEventListener('click', function(){
  var url = location.href;
  if (navigator.share){
    navigator.share({ title:'塔罗占卜 · 抽一张牌', text:'写下你的问题，抽一张牌。', url:url })
      .catch(function(){});
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ toast('链接已复制'); },
                                            function(){ toast(url); });
  } else { toast(url); }
});

var toastTimer = null;
function toast(msg){
  var el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1800);
}

/* =========================================================
   9. PWA：离线缓存 + 安装到主屏幕
   ========================================================= */
(function pwa(){
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  var banner = $('install'), txt = $('installTxt');
  var btn = $('installBtn'), x = $('installX');

  var standalone = (window.navigator.standalone === true) ||
                   (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (standalone) return;
  try { if (localStorage.getItem('tarot_no_install')) return; } catch (e) {}

  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '');
  var deferred = null;

  function show(msg, withBtn){
    txt.textContent = msg;
    if (withBtn) btn.hidden = false;
    banner.hidden = false;
  }
  function close(){
    banner.hidden = true;
    try { localStorage.setItem('tarot_no_install', '1'); } catch (e) {}
  }
  x.addEventListener('click', close);

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
    show('装到主屏幕，打开就是全屏 App，断网也能用。', true);
  });

  btn.addEventListener('click', function(){
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){
      deferred = null; btn.hidden = true; close();
    });
  });

  if (isIOS){
    setTimeout(function(){
      if (!banner.hidden) return;
      show('想当 App 用？点底部「分享」→「添加到主屏幕」，就有独立图标和全屏界面。', false);
    }, 2500);
  }
})();

/* =========================================================
   10. 启动
   ========================================================= */
buildChips();
setTopic('general', false);
onInput();
</script>
