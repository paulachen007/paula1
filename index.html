<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oracle">
<meta name="description" content="Ask a question and receive an answer.">
<title>Ask Oracle</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<style>
/* ---------- 字体（自托管 Almendra，离线可用）---------- */
@font-face{font-family:'Almendra';src:url('fonts/almendra-400.woff2') format('woff2');
  font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Almendra';src:url('fonts/almendra-700.woff2') format('woff2');
  font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Almendra';src:url('fonts/almendra-400-italic.woff2') format('woff2');
  font-weight:400;font-style:italic;font-display:swap}

:root{
  --sat:env(safe-area-inset-top, 0px);
  --sab:env(safe-area-inset-bottom, 0px);
  /* 设计稿取色 */
  --ink:#E3E1DB;
  --ink-2:#D0C7B8;
  --gold:#AC8D56;
  --line:#D0C7B8;
  --pill:rgba(208,204,201,.67);
  --btn:#2A2B29;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:#000;color:var(--ink);
  font-family:'Almendra',Georgia,'Times New Roman',serif;
  overflow:hidden;
  display:grid;place-items:center;
  padding:var(--sat) 0 var(--sab);
  -webkit-text-size-adjust:100%;
}

/* ---------- 舞台：按设计稿 428×926 等比缩放 ---------- */
.stage{
  position:relative;
  width:428px;height:926px;flex:none;
  transform:scale(var(--s, 1));
  transform-origin:center center;
  overflow:hidden;
  background:#000;
}
.screen{
  position:absolute;inset:0;
  opacity:0;visibility:hidden;
  transition:opacity .45s ease, visibility .45s;
}
.screen.active{opacity:1;visibility:visible}

/* ---------- 背景层 ---------- */
.bg,.person{position:absolute;pointer-events:none;display:block}
.scrim{position:absolute;pointer-events:none}
#screen-ask .bg{left:-47px;top:0;width:521px;height:926px}
#screen-ask .person{left:1px;top:156px;width:426px;height:541px}
#screen-ask .scrim{
  left:0;top:191px;width:427px;height:735px;
  background:linear-gradient(180deg,
    rgba(0,0,0,0) 0%, rgba(0,0,0,.10) 26%, rgba(0,0,0,.46) 52%,
    rgba(0,0,0,.80) 74%, rgba(0,0,0,.94) 100%);
}
#screen-answer .base{position:absolute;inset:0;background:#353634}
#screen-answer .bg{left:-53px;top:-12px;width:533px;height:950px}
#screen-answer .person{left:-74px;top:0;width:542px;height:606px}

/* ---------- 顶部玻璃按钮 ---------- */
.glass-btn{
  position:absolute;width:44px;height:44px;border-radius:50%;
  border:none;
  background:#D0C7B8;
  box-shadow:0 2px 8px rgba(0,0,0,.34),
             inset 0 1px 0 rgba(255,255,255,.55),
             0 0 0 1px rgba(255,255,255,.32);
  display:grid;place-items:center;padding:0;cursor:pointer;
  transition:transform .15s, filter .2s;
}
.glass-btn:active{transform:scale(.92);filter:brightness(1.06)}
.glass-btn img{width:23px;height:24px;display:block}
.glass-btn.share img{width:24px;height:24px}
#screen-ask .btn-home{left:24px;top:48px}
#screen-ask .btn-share{left:359px;top:48px}
#screen-answer .btn-home{left:24px;top:48px}
#screen-answer .btn-share{left:360px;top:48px}

/* ---------- 输入页文字 ---------- */
.greeting{
  position:absolute;left:38px;top:577px;width:310px;
  font-size:36px;font-weight:700;line-height:46.656px;
  color:var(--ink);letter-spacing:.1px;
}
.subtitle{
  position:absolute;left:38px;top:718px;width:326px;
  font-size:14px;font-weight:400;line-height:24px;color:var(--gold);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ---------- 底部输入条 ---------- */
.composer{
  position:absolute;left:38px;width:353px;height:46px;
  border-radius:23px;
  background:var(--pill);
  border:1px solid var(--line);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:center;
  padding:0 21px 0 9px;gap:9px;
}
#screen-ask .composer{top:844px}
#screen-answer .composer{top:856px}
.mic{
  flex:0 0 38px;width:38px;height:38px;border-radius:50%;
  border:none;cursor:pointer;padding:0;
  background:radial-gradient(circle at 38% 32%, #F3ECDC, #D5CCB8 68%, #BFB49C);
  box-shadow:0 1px 4px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.6);
  display:grid;place-items:center;
  transition:transform .15s;
}
.mic:active{transform:scale(.92)}
.mic svg{width:17px;height:17px;fill:rgba(58,52,42,.42)}
.mic.listening{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(172,141,86,.55)}50%{box-shadow:0 0 0 7px rgba(172,141,86,0)}}
.composer input{
  flex:1;min-width:0;border:none;background:transparent;outline:none;
  font-family:inherit;font-size:16px;line-height:24px;color:var(--ink);
  padding:0;
}
.composer input::placeholder{color:var(--ink);opacity:.92}
.kbd{
  flex:0 0 24px;width:24px;height:24px;border:none;background:transparent;
  padding:0;cursor:pointer;
}
.kbd img{width:24px;height:24px;display:block}

/* ---------- 解答页 ---------- */
.question{
  position:absolute;left:34px;top:110px;width:360px;
  font-size:24px;font-weight:700;line-height:31.104px;
  color:var(--ink-2);text-align:center;
}
.answer-card{
  position:absolute;left:100px;top:242px;width:224px;height:383px;
  border-radius:15px;
  background:linear-gradient(180deg,#221E1E 0%,#362F2F 20%,#423A3A 40%,#534848 52%,#655757 72%,#7E6D6D 100%);
  border:3px solid #E3E1DB;
  display:flex;align-items:center;
  padding:24px 13px 56px 25px;
  overflow:hidden;
}
.answer-card p{
  margin:0;
  font-size:24px;font-weight:400;line-height:31.104px;
  color:var(--ink-2);
}
.answer-card em{font-style:normal;color:var(--gold)}
#screen-answer.active .answer-card{
  animation:cardIn .7s cubic-bezier(.2,.8,.25,1) both;
}
@keyframes cardIn{
  0%{opacity:0;transform:translateY(22px) scale(.94)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
#screen-answer.active .answer-card p{animation:fadeUp .6s ease .28s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.btn-similar{
  position:absolute;left:79px;top:784px;width:270px;height:46px;
  border-radius:23px;
  background:var(--btn);
  border:1px solid #FFFFFF;
  color:var(--ink-2);
  font-family:inherit;font-size:20px;font-weight:700;line-height:25.92px;
  cursor:pointer;padding-left:10px;
  box-shadow:0 4px 4px rgba(0,0,0,.25), 0 0 20px rgba(227,225,219,.30);
  transition:transform .15s, box-shadow .25s;
}
.btn-similar:active{transform:scale(.97);box-shadow:0 2px 4px rgba(0,0,0,.3), 0 0 30px rgba(227,225,219,.45)}

/* ---------- 安装提示（仅 iOS，延迟出现，可关闭）---------- */
.install{
  position:fixed;left:16px;right:16px;
  bottom:calc(var(--sab) + 16px);z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:12px 10px 12px 15px;border-radius:14px;
  border:1px solid rgba(227,225,219,.28);
  background:rgba(18,17,16,.95);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-size:13px;line-height:1.55;color:var(--ink-2);
}
.install[hidden]{display:none}
.install span{flex:1}
.install button{
  font-family:inherit;font-size:13px;font-weight:700;color:#1E1B16;
  border:none;border-radius:9px;padding:9px 14px;cursor:pointer;
  background:linear-gradient(180deg,#F3ECDC,#CFC6B7);
}
.install .x{background:transparent;color:#8A8378;font-weight:400;padding:6px 8px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- ==================== 输入页 ==================== -->
  <section class="screen ask active" id="screen-ask">
    <img class="bg"     src="assets/bg-ask.webp"     alt="">
    <img class="person" src="assets/person-ask.webp" alt="">
    <div class="scrim"></div>

    <button class="glass-btn btn-home"  id="home1" aria-label="Home">
      <img src="assets/icon-home.svg" alt="">
    </button>
    <button class="glass-btn share btn-share" id="share1" aria-label="Share">
      <img src="assets/icon-share.svg" alt="">
    </button>

    <div class="greeting">Hello Crystal.Yao,<br>What would you like to ask?</div>
    <div class="subtitle">My Mercury Retrograde Status | Recent Career Horoscope</div>

    <form class="composer" id="composer1" autocomplete="off">
      <button type="button" class="mic" id="mic1" aria-label="Speak">
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-4 4.9V19h2.5a.9.9 0 1 1 0 1.8h-7a.9.9 0 1 1 0-1.8H11v-3.1A5 5 0 0 1 7 11a.9.9 0 1 1 1.8 0 3.2 3.2 0 0 0 6.4 0 .9.9 0 1 1 1.8 0z"/></svg>
      </button>
      <input id="q1" type="text" placeholder="Press to start speaking..." aria-label="Your question">
      <button type="button" class="kbd" id="kbd1" aria-label="Keyboard">
        <img src="assets/icon-keyboard.svg" alt="">
      </button>
    </form>
  </section>

  <!-- ==================== 解答页 ==================== -->
  <section class="screen answer" id="screen-answer">
    <div class="base"></div>
    <img class="bg"     src="assets/bg-answer.webp"     alt="">
    <img class="person" src="assets/person-answer.webp" alt="">

    <button class="glass-btn btn-home"  id="home2" aria-label="Home">
      <img src="assets/icon-home.svg" alt="">
    </button>
    <button class="glass-btn share btn-share" id="share2" aria-label="Share">
      <img src="assets/icon-share.svg" alt="">
    </button>

    <div class="question" id="question">What's for dinner tonight?</div>

    <div class="answer-card">
      <p id="answer"></p>
    </div>

    <button class="btn-similar" id="similar">View similar case</button>

    <form class="composer" id="composer2" autocomplete="off">
      <button type="button" class="mic" id="mic2" aria-label="Speak">
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-4 4.9V19h2.5a.9.9 0 1 1 0 1.8h-7a.9.9 0 1 1 0-1.8H11v-3.1A5 5 0 0 1 7 11a.9.9 0 1 1 1.8 0 3.2 3.2 0 0 0 6.4 0 .9.9 0 1 1 1.8 0z"/></svg>
      </button>
      <input id="q2" type="text" placeholder="Press to start speaking..." aria-label="Your question">
      <button type="button" class="kbd" id="kbd2" aria-label="Keyboard">
        <img src="assets/icon-keyboard.svg" alt="">
      </button>
    </form>
  </section>

</div>

<div class="install" id="install" hidden>
  <span id="installTxt"></span>
  <button id="installBtn" hidden>Install</button>
  <button class="x" id="installX" aria-label="Close">✕</button>
</div>

<script src="answers.js"></script>
<script>
var $ = function(id){ return document.getElementById(id); };
var screens = { ask: $('screen-ask'), answer: $('screen-answer') };
var inputAsk = $('q1'), inputAnswer = $('q2');

var DEFAULT_Q = "What's for dinner tonight?";
var currentQuestion = DEFAULT_Q;
var currentTopic = 'general';

/* ---------- 等比缩放，适配任意机型 ---------- */
function fit(){
  var cs = getComputedStyle(document.documentElement);
  var sat = parseFloat(cs.getPropertyValue('--sat')) || 0;
  var sab = parseFloat(cs.getPropertyValue('--sab')) || 0;
  var availH = window.innerHeight - sat - sab;
  var s = Math.min(window.innerWidth / 428, availH / 926);
  document.documentElement.style.setProperty('--s', s.toFixed(5));
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function(){ setTimeout(fit, 120); });
fit();

/* ---------- 金色高亮：{...} → <em> ---------- */
function renderAnswer(text){
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\{([^}]+)\}/g, '<em>$1</em>');
}

/* ---------- 抽答案 ---------- */
function draw(question){
  var q = (question || '').trim();
  currentQuestion = q || DEFAULT_Q;

  var det = detectTopic(currentQuestion);
  currentTopic = det.topic;
  $('question').textContent = currentQuestion;
  $('answer').innerHTML = renderAnswer(pickAnswer(currentTopic, false));

  var card = screens.answer.querySelector('.answer-card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';
}

function show(name){
  for (var k in screens) screens[k].classList.toggle('active', k === name);
  if (name === 'ask'){ inputAsk.value = ''; }
  inputAsk.blur(); inputAnswer.blur();
}
function go(question){ draw(question); show('answer'); }

/* ---------- 提交 ---------- */
$('composer1').addEventListener('submit', function(e){ e.preventDefault(); go(inputAsk.value); });
$('composer2').addEventListener('submit', function(e){ e.preventDefault(); go(inputAnswer.value || currentQuestion); });

[inputAsk, inputAnswer].forEach(function(inp){
  inp.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); inp.blur(); go(inp.value); }
  });
});

/* ---------- View similar case：再抽一张 ---------- */
$('similar').addEventListener('click', function(){
  $('answer').innerHTML = renderAnswer(pickAnswer(currentTopic, false));
  var card = screens.answer.querySelector('.answer-card');
  card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
  if (navigator.vibrate){ try { navigator.vibrate(10); } catch(e){} }
});

/* ---------- 主页按钮 = 回到提问页 ---------- */
$('home1').addEventListener('click', function(){ inputAsk.value = ''; show('ask'); });
$('home2').addEventListener('click', function(){ show('ask'); });

/* ---------- 键盘图标 = 聚焦输入 ---------- */
$('kbd1').addEventListener('click', function(){ inputAsk.focus(); });
$('kbd2').addEventListener('click', function(){ inputAnswer.focus(); });

/* ---------- 分享 ---------- */
function share(){
  var url = location.href;
  if (navigator.share){
    navigator.share({ title:'Ask Oracle', text: currentQuestion, url: url }).catch(function(){});
  } else if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).catch(function(){});
  }
}
$('share1').addEventListener('click', share);
$('share2').addEventListener('click', share);

/* ---------- 语音输入（不支持时退回键盘）---------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function bindMic(micId, input){
  var btn = $(micId), rec = null;
  if (SR){
    rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onresult = function(e){
      btn.classList.remove('listening');
      go(e.results[0][0].transcript);
    };
    rec.onerror = function(){ btn.classList.remove('listening'); };
    rec.onend   = function(){ btn.classList.remove('listening'); };
  }
  btn.addEventListener('click', function(){
    if (!rec){ input.focus(); return; }
    try { btn.classList.add('listening'); rec.start(); }
    catch (e){ btn.classList.remove('listening'); input.focus(); }
  });
}
bindMic('mic1', inputAsk);
bindMic('mic2', inputAnswer);

/* ---------- PWA ---------- */
(function pwa(){
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
  var standalone = (window.navigator.standalone === true) ||
                   (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (standalone) return;
  try { if (localStorage.getItem('oracle_no_install')) return; } catch (e) {}

  var banner = $('install'), txt = $('installTxt'), btn = $('installBtn');
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '');
  var deferred = null;

  $('installX').addEventListener('click', function(){
    banner.hidden = true;
    try { localStorage.setItem('oracle_no_install','1'); } catch(e){}
  });
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e; btn.hidden = false;
    txt.textContent = 'Install to your home screen for a full-screen app that works offline.';
    banner.hidden = false;
  });
  btn.addEventListener('click', function(){
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ banner.hidden = true; deferred = null; });
  });
  if (isIOS){
    setTimeout(function(){
      if (!banner.hidden) return;
      txt.textContent = 'Tap Share, then "Add to Home Screen" to use this as a full-screen app.';
      banner.hidden = false;
    }, 7000);
  }
})();

show('ask');
</script>
</body>
</html>
