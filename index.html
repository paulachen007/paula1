<link rel="apple-touch-startup-image" href="assets/splash/390x844@3x.jpg" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="assets/splash/428x926@3x.jpg" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="assets/splash/375x812@3x.jpg" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">

<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<style>
/* ---------- 字体（自托管 Almendra，离线可用）---------- */
@font-face{font-family:'Almendra';src:url('fonts/almendra-400.woff2') format('woff2');
  font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Almendra';src:url('fonts/almendra-700.woff2') format('woff2');
  font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Almendra';src:url('fonts/almendra-400-italic.woff2') format('woff2');
  font-weight:400;font-style:italic;font-display:swap}

:root{
  --sat:env(safe-area-inset-top, 0px);
  --sab:env(safe-area-inset-bottom, 0px);
  /* 设计稿取色 */
  --ink:#E3E1DB;
  --ink-2:#D0C7B8;
  --gold:#AC8D56;
  --line:#D0C7B8;
  --pill:rgba(208,204,201,.67);
  --btn:#2A2B29;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0;background:#000;color:var(--ink);
  font-family:'Almendra',"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  /* 高度由 JS 写入真实的「可见视口高度」，确保底部输入条不被 Safari 工具栏盖住 */
  position:fixed;left:0;right:0;top:0;height:var(--vh,100%);
  overflow:hidden;
  display:grid;place-items:center;
  padding:var(--sat) 0 var(--sab);
  -webkit-text-size-adjust:100%;
  touch-action:manipulation;              /* 禁掉双击缩放 */
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;             /* 禁掉长按弹出菜单 */
}
input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;user-drag:none}

/* ---------- 舞台：按设计稿 428×926 等比缩放 ----------
   transform:scale() 不改变布局尺寸，所以必须用一个「尺寸=缩放后尺寸」的
   frame 来参与居中，否则缩放后位置会跑偏、底部输入条会被裁掉。 */
.frame{
  position:relative;
  width:calc(428px * var(--s, 1));
  height:calc(926px * var(--s, 1));
  overflow:hidden;
  background:#000;
}
.stage{
  position:absolute;left:0;top:0;
  width:428px;height:926px;
  transform:scale(var(--s, 1));
  transform-origin:top left;
}
.screen{
  position:absolute;inset:0;
  opacity:0;visibility:hidden;
  transition:opacity .45s ease, visibility .45s;
}
.screen.active{opacity:1;visibility:visible}

/* ---------- 背景层 ---------- */
.bg,.person{position:absolute;pointer-events:none;display:block}
.scrim{position:absolute;pointer-events:none}
#screen-ask .bg{left:-47px;top:0;width:521px;height:926px}
#screen-ask .person{left:1px;top:156px;width:426px;height:541px}
#screen-ask .scrim{
  left:0;top:191px;width:427px;height:735px;
  background:linear-gradient(180deg,
    rgba(0,0,0,0) 0%, rgba(0,0,0,.10) 26%, rgba(0,0,0,.46) 52%,
    rgba(0,0,0,.80) 74%, rgba(0,0,0,.94) 100%);
}
#screen-answer .base{position:absolute;inset:0;background:#353634}
#screen-answer .bg{left:-53px;top:-12px;width:533px;height:950px}
#screen-answer .person{left:-74px;top:0;width:542px;height:606px}

/* ---------- 顶部玻璃按钮 ---------- */
.glass-btn{
  position:absolute;width:44px;height:44px;border-radius:50%;
  border:none;
  background:#D0C7B8;
  box-shadow:0 2px 8px rgba(0,0,0,.34),
             inset 0 1px 0 rgba(255,255,255,.55),
             0 0 0 1px rgba(255,255,255,.32);
  display:grid;place-items:center;padding:0;cursor:pointer;
  transition:transform .15s, filter .2s;
}
.glass-btn:active{transform:scale(.92);filter:brightness(1.06)}
.glass-btn img{width:23px;height:24px;display:block}
.glass-btn.share img{width:24px;height:24px}
#screen-ask .btn-home{left:24px;top:48px}
#screen-ask .btn-share{left:359px;top:48px}
#screen-answer .btn-home{left:24px;top:48px}
#screen-answer .btn-share{left:360px;top:48px}

/* ---------- 输入页文字 ---------- */
.greeting{
  position:absolute;left:38px;top:577px;width:310px;
  font-size:36px;font-weight:700;line-height:46.656px;
  color:var(--ink);letter-spacing:.1px;
}
.subtitle{
  position:absolute;left:38px;top:718px;width:326px;
  font-size:14px;font-weight:400;line-height:24px;color:var(--gold);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ---------- 底部输入条 ---------- */
.composer{
  position:absolute;left:38px;width:353px;height:46px;
  border-radius:23px;
  background:var(--pill);
  border:1px solid var(--line);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:center;
  padding:0 21px 0 9px;gap:9px;
}
#screen-ask .composer{top:844px}
#screen-answer .composer{top:856px}
.mic{
  flex:0 0 38px;width:38px;height:38px;border-radius:50%;
  border:none;cursor:pointer;padding:0;
  background:radial-gradient(circle at 38% 32%, #F3ECDC, #D5CCB8 68%, #BFB49C);
  box-shadow:0 1px 4px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.6);
  display:grid;place-items:center;
  transition:transform .15s;
}
.mic:active{transform:scale(.92)}
.mic svg{width:17px;height:17px;fill:rgba(58,52,42,.42)}
.mic.listening{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(172,141,86,.55)}50%{box-shadow:0 0 0 7px rgba(172,141,86,0)}}
.composer input{
  flex:1;min-width:0;border:none;background:transparent;outline:none;
  font-family:inherit;font-size:16px;line-height:24px;color:var(--ink);
  padding:0;
}
.composer input::placeholder{color:var(--ink);opacity:.92}
.act{
  flex:0 0 24px;width:24px;height:24px;border:none;background:transparent;
  padding:0;cursor:pointer;display:grid;place-items:center;
}
.act img,.act svg{width:24px;height:24px;display:block}
.act .send-ico{display:none}
.composer.has-text .act .kbd-ico{display:none}
.composer.has-text .act .send-ico{display:block}
.composer.has-text{border-color:#E3E1DB}

/* ---------- 轻提示 ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(var(--sab) + 96px);
  transform:translateX(-50%) translateY(12px);
  z-index:30;max-width:86%;
  padding:10px 18px;border-radius:999px;
  background:rgba(227,225,219,.96);color:#1E1B16;
  font-size:13px;line-height:1.5;text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 解答页 ---------- */
.question{
  position:absolute;left:34px;top:110px;width:360px;
  font-size:24px;font-weight:700;line-height:31.104px;
  color:var(--ink-2);text-align:center;
}
.answer-card{
  position:absolute;left:100px;top:242px;width:224px;height:383px;
  border-radius:15px;
  background:linear-gradient(180deg,#221E1E 0%,#362F2F 20%,#423A3A 40%,#534848 52%,#655757 72%,#7E6D6D 100%);
  border:3px solid #E3E1DB;
  display:flex;align-items:center;
  padding:24px 13px 56px 25px;
  overflow:hidden;
}
.answer-card p{
  margin:0;
  font-size:24px;font-weight:400;line-height:31.104px;
  color:var(--ink-2);
  text-wrap:pretty;              /* 避免中文最后一行只剩一两个字（支持的浏览器生效） */
  word-break:normal;
  line-break:strict;
}
.answer-card em{font-style:normal;color:var(--gold)}
/* 中文：宋体渲染，字号与行距单独调整 */
#answer.zh{font-size:18.5px;line-height:1.82;letter-spacing:.01em}
.question.zh{font-size:21px;line-height:1.5;letter-spacing:.03em}
/* ---------- 抽答案动效 ----------
   卡片绕竖轴转 3 整圈（1080°）→ 停住 → 答案文字浮现。
   转的过程中答案是隐藏的，所以看不到字在转。
   时序：--spin 时长 + --pause 停留，之后文字 --fade 淡入。            */
:root{
  --spin:1.5s;      /* 3 圈，每圈 0.5s */
  --pause:.14s;     /* 转完停一下 */
  --fade:.45s;      /* 文字淡入 */
}
#screen-answer.active .answer-card{
  animation:cardSpin var(--spin) cubic-bezier(.25,.7,.25,1) both;
  transform-style:preserve-3d;
  will-change:transform;
}
@keyframes cardSpin{
  0%{
    opacity:0;
    transform:perspective(1200px) rotateY(0deg) scale(.9);
    box-shadow:0 0 0 rgba(227,225,219,0);
  }
  8%{ opacity:1; }
  55%{ box-shadow:0 0 34px rgba(227,225,219,.42); }
  100%{
    opacity:1;
    transform:perspective(1200px) rotateY(1080deg) scale(1);
    box-shadow:0 0 0 rgba(227,225,219,0);
  }
}
/* 文字等转完 + 停留之后才出现 */
#screen-answer.active .answer-card p{
  animation:fadeUp var(--fade) ease calc(var(--spin) + var(--pause)) both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}

.btn-similar{
  position:absolute;left:79px;top:784px;width:270px;height:46px;
  border-radius:23px;
  background:var(--btn);
  border:1px solid #FFFFFF;
  color:var(--ink-2);
  font-family:inherit;font-size:20px;font-weight:700;line-height:25.92px;
  cursor:pointer;padding-left:10px;
  box-shadow:0 4px 4px rgba(0,0,0,.25), 0 0 20px rgba(227,225,219,.30);
  transition:transform .15s, box-shadow .25s;
}
.btn-similar:active{transform:scale(.97);box-shadow:0 2px 4px rgba(0,0,0,.3), 0 0 30px rgba(227,225,219,.45)}

/* ---------- 安装提示（仅 iOS，延迟出现，可关闭）---------- */
.install{
  position:fixed;left:16px;right:16px;
  top:calc(var(--sat) + 12px);z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:12px 10px 12px 15px;border-radius:14px;
  border:1px solid rgba(227,225,219,.28);
  background:rgba(18,17,16,.95);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-size:13px;line-height:1.55;color:var(--ink-2);
}
.install[hidden]{display:none}
.install span{flex:1}
.install button{
  font-family:inherit;font-size:13px;font-weight:700;color:#1E1B16;
  border:none;border-radius:9px;padding:9px 14px;cursor:pointer;
  background:linear-gradient(180deg,#F3ECDC,#CFC6B7);
}
.install .x{background:transparent;color:#8A8378;font-weight:400;padding:6px 8px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="frame" id="frame">
<div class="stage" id="stage">

  <!-- ==================== 输入页 ==================== -->
  <section class="screen ask active" id="screen-ask">
    <img class="bg"     src="assets/bg-ask.webp"     alt="">
    <img class="person" src="assets/person-ask.webp" alt="">
    <div class="scrim"></div>

    <button class="glass-btn btn-home"  id="home1" aria-label="Home">
      <img src="assets/icon-home.svg" alt="">
    </button>
    <button class="glass-btn share btn-share" id="share1" aria-label="Share">
      <img src="assets/icon-share.svg" alt="">
    </button>

    <div class="greeting">Hello Crystal.Yao,<br>What would you like to ask?</div>
    <div class="subtitle">My Mercury Retrograde Status | Recent Career Horoscope</div>

    <form class="composer" id="composer1" autocomplete="off">
      <button type="button" class="mic" id="mic1" aria-label="Speak">
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-4 4.9V19h2.5a.9.9 0 1 1 0 1.8h-7a.9.9 0 1 1 0-1.8H11v-3.1A5 5 0 0 1 7 11a.9.9 0 1 1 1.8 0 3.2 3.2 0 0 0 6.4 0 .9.9 0 1 1 1.8 0z"/></svg>
      </button>
      <input id="q1" type="text" placeholder="Press to start speaking..." aria-label="Your question">
      <button type="button" class="act" id="act1" aria-label="Type or send">
        <img class="kbd-ico" src="assets/icon-keyboard.svg" alt="">
        <svg class="send-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12h13M11 5.5l6.5 6.5-6.5 6.5" fill="none" stroke="#E3E1DB"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </section>

  <!-- ==================== 解答页 ==================== -->
  <section class="screen answer" id="screen-answer">
    <div class="base"></div>
    <img class="bg"     src="assets/bg-answer.webp"     alt="">
    <img class="person" src="assets/person-answer.webp" alt="">

    <button class="glass-btn btn-home"  id="home2" aria-label="Home">
      <img src="assets/icon-home.svg" alt="">
    </button>
    <button class="glass-btn share btn-share" id="share2" aria-label="Share">
      <img src="assets/icon-share.svg" alt="">
    </button>

    <div class="question" id="question">What's for dinner tonight?</div>

    <div class="answer-card">
      <p id="answer"></p>
    </div>

    <button class="btn-similar" id="similar">View similar case</button>

    <form class="composer" id="composer2" autocomplete="off">
      <button type="button" class="mic" id="mic2" aria-label="Speak">
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-4 4.9V19h2.5a.9.9 0 1 1 0 1.8h-7a.9.9 0 1 1 0-1.8H11v-3.1A5 5 0 0 1 7 11a.9.9 0 1 1 1.8 0 3.2 3.2 0 0 0 6.4 0 .9.9 0 1 1 1.8 0z"/></svg>
      </button>
      <input id="q2" type="text" placeholder="Press to start speaking..." aria-label="Your question">
      <button type="button" class="act" id="act2" aria-label="Type or send">
        <img class="kbd-ico" src="assets/icon-keyboard.svg" alt="">
        <svg class="send-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12h13M11 5.5l6.5 6.5-6.5 6.5" fill="none" stroke="#E3E1DB"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </section>

</div>
</div>

<div class="toast" id="toast"></div>

<div class="install" id="install" hidden>
  <span id="installTxt"></span>
  <button id="installBtn" hidden>Install</button>
  <button class="x" id="installX" aria-label="Close">✕</button>
</div>

<script src="answers.js"></script>
<script>
var $ = function(id){ return document.getElementById(id); };
var screens = { ask: $('screen-ask'), answer: $('screen-answer') };
var inputAsk = $('q1'), inputAnswer = $('q2');

var DEFAULT_Q = "What's for dinner tonight?";
var currentQuestion = DEFAULT_Q;
var currentTopic = 'general';
var currentLang = 'en';   /* 问题用什么语言问，就用什么语言答 */

/* ---------- 等比缩放，适配任意机型 ---------- */
var typing = false;   /* 输入法弹起期间冻结缩放，否则页面会跳 */
function fit(){
  if (typing) return;
  var root = document.documentElement;

  /* iOS 上 innerHeight / clientHeight / visualViewport.height 会不一致，
     取三者「最小」才能保证舞台在最短的那个解释下也完整可见（否则底部输入条会被裁掉）*/
  var cands = [window.innerHeight, root.clientHeight];
  if (window.visualViewport) cands.push(window.visualViewport.height);
  cands = cands.filter(function(v){ return v && v > 200; });
  var vh = cands.length ? Math.min.apply(null, cands) : window.innerHeight;
  root.style.setProperty('--vh', vh + 'px');             /* body 高度 = 最保守的可见高度 */

  var cs = getComputedStyle(root);
  var sat = parseFloat(cs.getPropertyValue('--sat')) || 0;
  var sab = parseFloat(cs.getPropertyValue('--sab')) || 0;
  var availH = Math.max(320, vh - sat - sab) * 0.98;     /* 再留 2% 余量，不贴住工具栏 */
  var s = Math.min(window.innerWidth / 428, availH / 926);
  root.style.setProperty('--s', s.toFixed(5));
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function(){ setTimeout(fit, 150); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
fit();

/* ---------- 金色高亮：{...} → <em> ---------- */
function renderAnswer(text){
  var safe = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  /* 英文答案在数据里用 {…} 手工标记了高亮 */
  if (/\{[^}]+\}/.test(safe)) return safe.replace(/\{([^}]+)\}/g, '<em>$1</em>');

  /* 中文答案没有手工标记：自动高亮开头那句短判断（对应设计稿的金色强调） */
  if (hasCJK(safe)){
    var m = safe.match(/^([^。，！？；、]{1,9})[。，！？；]/);
    if (m) return '<em>' + m[1] + '</em>' + safe.slice(m[1].length);
  }
  return safe;
}

/* 写入答案，并按语言切换排版 */
function setAnswer(text){
  var el = $('answer');
  el.className = hasCJK(text) ? 'zh' : '';
  el.innerHTML = renderAnswer(text);
}

/* 重播「转 3 圈 → 停住 → 答案浮现」动效 */
function restartReveal(){
  var card = screens.answer.querySelector('.answer-card');
  var text = $('answer');
  card.style.animation = 'none';
  text.style.animation = 'none';
  void card.offsetWidth;          /* 强制重排，否则动画不会重头播 */
  card.style.animation = '';
  text.style.animation = '';
}

/* ---------- 抽答案 ---------- */
function draw(question){
  var q = (question || '').trim();
  currentQuestion = q || DEFAULT_Q;

  currentLang = hasCJK(currentQuestion) ? 'zh' : 'en';

  var det = detectTopic(currentQuestion);
  currentTopic = det.topic;

  var qEl = $('question');
  qEl.textContent = currentQuestion;
  qEl.classList.toggle('zh', currentLang === 'zh');

  setAnswer(pickAnswer(currentTopic, currentLang));

  restartReveal();
}

function show(name){
  for (var k in screens) screens[k].classList.toggle('active', k === name);
  if (name === 'ask'){ inputAsk.value = ''; }
  inputAsk.blur(); inputAnswer.blur();
}
function go(question){ draw(question); show('answer'); }

/* ---------- 提交 ---------- */
$('composer1').addEventListener('submit', function(e){ e.preventDefault(); go(inputAsk.value); });
$('composer2').addEventListener('submit', function(e){ e.preventDefault(); go(inputAnswer.value || currentQuestion); });

[inputAsk, inputAnswer].forEach(function(inp){
  inp.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); inp.blur(); go(inp.value); }
  });
});

/* ---------- View similar case：再抽一张 ---------- */
$('similar').addEventListener('click', function(){
  setAnswer(pickAnswer(currentTopic, currentLang));
  restartReveal();
  if (navigator.vibrate){ try { navigator.vibrate(12); } catch(e){} }
});

/* ---------- 主页按钮 = 回到提问页 ---------- */
$('home1').addEventListener('click', function(){ inputAsk.value = ''; show('ask'); });
$('home2').addEventListener('click', function(){ show('ask'); });

/* ---------- 轻提示 ---------- */
var toastTimer = null;
function toast(msg){
  var el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
}

/* ---------- 分享 ---------- */
function share(){
  var url = location.href;
  if (navigator.share){
    navigator.share({ title:'Ask Oracle', text: currentQuestion, url: url }).catch(function(){});
  } else if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).catch(function(){});
  }
}
$('share1').addEventListener('click', share);
$('share2').addEventListener('click', share);

/* ---------- 输入条：整条可点，右侧按钮空=键盘 / 有字=发送 ---------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function bindComposer(formId, actId, micId, input){
  var form = $(formId), act = $(actId), mic = $(micId);

  /* 有文字时右侧按钮变成发送箭头 */
  function sync(){ form.classList.toggle('has-text', input.value.trim().length > 0); }
  input.addEventListener('input', sync);
  sync();

  /* 键盘弹起/收起期间冻结缩放，避免页面跳动 */
  input.addEventListener('focus', function(){ typing = true; });
  input.addEventListener('blur', function(){
    setTimeout(function(){ typing = false; fit(); }, 250);
  });

  /* 点胶囊任意位置都能开始输入（手写、拼音、英文都行） */
  form.addEventListener('click', function(e){
    if (act.contains(e.target) || mic.contains(e.target)) return;
    if (e.target !== input) input.focus();
  });

  /* 右侧按钮：有文字 → 直接提交；没文字 → 叫出键盘 */
  act.addEventListener('click', function(e){
    e.preventDefault();
    if (input.value.trim()){ input.blur(); go(input.value); }
    else input.focus();
  });

  /* 语音输入（浏览器支持时启用，不支持则明确提示并切到键盘） */
  var rec = null;
  if (SR){
    rec = new SR();
    rec.lang = 'en-US';
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = function(e){
      mic.classList.remove('listening');
      var text = (e.results[0][0].transcript || '').trim();
      if (text) go(text);
    };
    rec.onerror = function(ev){
      mic.classList.remove('listening');
      if (ev && ev.error === 'not-allowed')
        toast('Microphone access was denied — tap the field to type instead.');
      else
        toast('Did not catch that — tap the field to type instead.');
    };
    rec.onend = function(){ mic.classList.remove('listening'); };
  }
  mic.addEventListener('click', function(e){
    e.preventDefault();
    if (!rec){
      toast('Voice input is not supported here — tap the field and type.');
      input.focus();
      return;
    }
    try {
      mic.classList.add('listening');
      rec.start();
      toast('Listening… say your question.');
    } catch (err) {
      mic.classList.remove('listening');
      input.focus();
    }
  });
}

bindComposer('composer1', 'act1', 'mic1', inputAsk);
bindComposer('composer2', 'act2', 'mic2', inputAnswer);

/* ---------- PWA ---------- */
(function pwa(){
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
  var standalone = (window.navigator.standalone === true) ||
                   (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (standalone) return;
  try { if (localStorage.getItem('oracle_no_install')) return; } catch (e) {}

  var banner = $('install'), txt = $('installTxt'), btn = $('installBtn');
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '');
  var deferred = null;

  $('installX').addEventListener('click', function(){
    banner.hidden = true;
    try { localStorage.setItem('oracle_no_install','1'); } catch(e){}
  });
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e; btn.hidden = false;
    txt.textContent = 'Install to your home screen for a full-screen app that works offline.';
    banner.hidden = false;
  });
  btn.addEventListener('click', function(){
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ banner.hidden = true; deferred = null; });
  });
  if (isIOS){
    setTimeout(function(){
      if (!banner.hidden) return;
      txt.textContent = 'Tap Share, then "Add to Home Screen" to use this as a full-screen app.';
      banner.hidden = false;
    }, 7000);
  }
})();

show('ask');
