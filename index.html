<style>
:root{
  --gold:#d9b877;
  --gold-2:#f5e3b8;
  --ink:#ece8fb;
  --muted:#9d95c4;
  --bg-0:#080714;
  --bg-1:#171132;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(120% 80% at 50% -10%, #2c2159 0%, transparent 55%),
    radial-gradient(100% 60% at 50% 110%, #241a4d 0%, transparent 60%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
  background-attachment:fixed;
  min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}

/* ---------- 星空 ---------- */
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#sky i{position:absolute;background:#fff;border-radius:50%;opacity:.75;animation:twinkle var(--d,3s) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.9;transform:scale(1.15)}}

main{position:relative;z-index:1;width:100%;max-width:450px;display:flex;flex-direction:column;align-items:center;gap:16px}

/* ---------- 标题 ---------- */
header{text-align:center;display:flex;flex-direction:column;gap:6px;margin-top:4px}
h1{
  margin:0;font-size:clamp(22px,6.4vw,28px);font-weight:600;letter-spacing:.16em;
  background:linear-gradient(180deg,var(--gold-2),var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold);
}
header p{margin:0;color:var(--muted);font-size:13.5px;letter-spacing:.04em}

/* ---------- 提问 ---------- */
.ask{width:100%;display:flex;flex-direction:column;gap:10px}
input[type=text]{
  width:100%;font-size:16px;font-family:inherit;color:var(--ink);
  padding:14px 16px;border-radius:14px;
  border:1px solid rgba(217,184,119,.28);
  background:rgba(255,255,255,.05);outline:none;
  transition:border-color .2s, background .2s;
}
input[type=text]::placeholder{color:#7d76a3}
input[type=text]:focus{border-color:rgba(217,184,119,.65);background:rgba(255,255,255,.08)}

/* ---------- 话题选择 ---------- */
.topics-box{display:flex;flex-direction:column;gap:8px}
.topics-label{font-size:12px;color:var(--muted);letter-spacing:.06em;text-align:center}
.topics{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.chip{
  font-family:inherit;font-size:13px;line-height:1;
  padding:0 13px;min-height:36px;
  display:inline-flex;align-items:center;gap:4px;
  border-radius:999px;cursor:pointer;
  border:1px solid rgba(217,184,119,.28);
  background:rgba(255,255,255,.04);color:var(--muted);
  transition:border-color .18s, background .18s, color .18s;
}
.chip.on{
  border-color:rgba(217,184,119,.85);
  background:rgba(217,184,119,.16);
  color:var(--gold-2);font-weight:600;
}
.chip:active{transform:scale(.96)}

/* ---------- 按钮 ---------- */
.btn{
  width:100%;min-height:52px;padding:14px 18px;
  font-family:inherit;font-size:16px;font-weight:600;letter-spacing:.1em;
  color:#241a08;border:none;border-radius:14px;cursor:pointer;
  background:linear-gradient(180deg,var(--gold-2),var(--gold));
  box-shadow:0 6px 22px rgba(217,184,119,.28), inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform .12s ease, box-shadow .2s, opacity .2s;
}
.btn:active{transform:translateY(2px) scale(.99);box-shadow:0 3px 12px rgba(217,184,119,.22)}
.btn:disabled{opacity:.45;box-shadow:none}
.again{background:transparent;color:var(--gold-2);border:1px solid rgba(217,184,119,.5);box-shadow:none;font-weight:500}
.again:active{transform:translateY(2px)}

/* ---------- 牌 ---------- */
.stage{perspective:1400px;perspective-origin:50% 40%;padding:4px 0 2px}
.card{
  position:relative;width:min(55vw,190px);aspect-ratio:2/3;
  transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.22,.85,.28,1);
  will-change:transform;
}
.card.flipped{transform:rotateY(180deg)}
.card.shuffling{animation:shuffle .62s ease-in-out}
@keyframes shuffle{
  0%{transform:rotate(0) translateY(0)}
  20%{transform:rotate(-7deg) translateY(-10px)}
  45%{transform:rotate(6deg) translateY(6px)}
  70%{transform:rotate(-4deg) translateY(-4px)}
  100%{transform:rotate(0) translateY(0)}
}
.face{
  position:absolute;inset:0;border-radius:var(--radius);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 14px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(217,184,119,.45) inset;
}
.back{
  background:
    repeating-linear-gradient(45deg, rgba(217,184,119,.10) 0 6px, transparent 6px 12px),
    repeating-linear-gradient(-45deg, rgba(217,184,119,.10) 0 6px, transparent 6px 12px),
    radial-gradient(80% 60% at 50% 40%, #2b2160 0%, #140f2e 75%);
  border:1.5px solid rgba(217,184,119,.5);
}
.back-inner{
  width:74%;height:82%;border:1px solid rgba(217,184,119,.42);border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--gold);
  background:radial-gradient(60% 50% at 50% 50%, rgba(217,184,119,.14), transparent 70%);
  animation:breathe 3.6s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.front{
  transform:rotateY(180deg);padding:12px;
  border:1.5px solid rgba(217,184,119,.72);
  background:radial-gradient(85% 65% at 50% 22%, #3a2c72 0%, #1b1440 55%, #120e2c 100%);
}
.front-inner{
  width:100%;height:100%;border:1px solid rgba(217,184,119,.35);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:10px 6px;text-align:center;transition:transform .5s ease;
}
.front-inner.rev{transform:rotate(180deg)}
.f-num{position:absolute;top:16px;left:18px;font-size:11px;letter-spacing:.14em;color:var(--gold);opacity:.85;font-variant-numeric:tabular-nums}
.f-num.br{top:auto;left:auto;bottom:16px;right:18px;transform:rotate(180deg)}
.f-sym{font-size:clamp(34px,11vw,44px);line-height:1;filter:drop-shadow(0 0 14px rgba(217,184,119,.5))}
.f-name{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:clamp(17px,5.4vw,21px);font-weight:600;letter-spacing:.14em;color:var(--gold-2)}
.f-en{font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}

/* ---------- 结果 ---------- */
.result{
  width:100%;display:none;flex-direction:column;gap:12px;
  padding:18px;border-radius:var(--radius);
  border:1px solid rgba(217,184,119,.22);
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  animation:rise .5s ease both;
}
.result.show{display:flex}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.r-q{margin:0;font-size:12.5px;color:var(--muted);padding-left:10px;border-left:2px solid rgba(217,184,119,.4);line-height:1.6;word-break:break-word}
.r-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{
  font-size:11.5px;letter-spacing:.12em;padding:4px 10px;border-radius:999px;white-space:nowrap;
  border:1px solid rgba(217,184,119,.5);color:var(--gold-2);background:rgba(217,184,119,.12);
}
.badge.rev{border-color:rgba(180,140,255,.55);color:#d9c8ff;background:rgba(150,110,255,.14)}
.r-name{margin:0;font-size:17px;font-weight:600;letter-spacing:.05em;color:var(--gold-2)}
.r-kw{margin:0;font-size:12.5px;color:var(--gold);letter-spacing:.06em}
.r-cardtext{margin:0;font-size:13px;line-height:1.7;color:var(--muted)}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(217,184,119,.35),transparent);margin:2px 0}
.a-label{margin:0;font-size:12.5px;color:var(--gold);letter-spacing:.08em}
.a-text{margin:0;font-size:16.5px;line-height:1.8;color:#f3efff;font-weight:500}
.a-meta{margin:0;font-size:11.5px;color:#6f6894;letter-spacing:.04em}

footer{position:relative;z-index:1;margin-top:auto;padding-top:22px;font-size:11.5px;color:#5f5885;letter-spacing:.06em;text-align:center}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  .card{transition:transform .01ms}
}
@media (min-height:800px) and (min-width:390px){.card{width:min(52vw,204px)}}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>

<main>
  <header>
    <h1>塔 罗 占 卜</h1>
    <p>写下你的问题，抽一张牌</p>
  </header>

  <div class="ask">
    <input id="q" type="text" inputmode="text" autocomplete="off"
           placeholder="例如：我这次考试能过吗？" aria-label="你的问题">

    <div class="topics-box">
      <span class="topics-label" id="topicsLabel">这个问题属于…（自动识别，可手动改）</span>

    </div>

    <button class="btn" id="draw">抽 一 张 牌</button>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="face back"><div class="back-inner">✦</div></div>
      <div class="face front">
        <span class="f-num" id="fNum">0</span>
        <div class="front-inner" id="frontInner">
          <div class="f-sym" id="fSym">🃏</div>

      </div>
    </div>
  </div>

  <section class="result" id="result" aria-live="polite">
    <p class="r-q" id="rQ"></p>

    <div>
      <div class="r-head">
        <span class="badge" id="rOrient">正位</span>
        <h2 class="r-name" id="rName">愚者 · The Fool</h2>
      </div>
      <p class="r-kw" id="rKw"></p>
    </div>
    <p class="r-cardtext" id="rCardText"></p>

    <div class="divider"></div>

    <p class="a-label" id="aLabel">🎯 针对你的问题</p>
    <p class="a-text" id="aText"></p>
    <p class="a-meta" id="aMeta"></p>

    <button class="btn again" id="again">再抽一张</button>
  </section>

  <footer>仅供娱乐 · 命运始终在你手里</footer>
</main>

<script>

   ========================================================= */
var $ = function(id){ return document.getElementById(id); };
var card = $('card'), frontInner = $('frontInner'), result = $('result');
var btnDraw = $('draw'), btnAgain = $('again'), input = $('q');
var topicsEl = $('topics'), topicsLabel = $('topicsLabel');
var currentTopic = 'general';
var manualTopic = false;
var busy = false;

/* =========================================================
   5. 问题 → 话题 识别（关键词计分，长词权重更高）
   ========================================================= */
var TOPIC_ORDER = ['love','career','study','money','social','health','general'];

function detectTopic(q){
  if (!q) return {topic:'general', hits:0};
  var best = 'general', bestScore = 0, bestHits = 0;
  for (var i = 0; i < TOPIC_ORDER.length; i++){
    var key = TOPIC_ORDER[i];
    if (key === 'general') continue;
    var words = TOPICS[key].keys, score = 0, hits = 0;
    for (var j = 0; j < words.length; j++){
      if (q.indexOf(words[j]) >= 0){ score += words[j].length; hits++; }
    }
    if (score > bestScore){ bestScore = score; best = key; bestHits = hits; }
  }
  return {topic:best, hits:bestHits};
}

/* =========================================================
   6. 话题按钮
   ========================================================= */
function buildChips(){
  for (var i = 0; i < TOPIC_ORDER.length; i++){
    (function(key){
      var t = TOPICS[key];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.setAttribute('data-topic', key);
      b.innerHTML = t.icon + ' ' + t.label;
      b.addEventListener('click', function(){
        manualTopic = true;
        setTopic(key, true);
        if (navigator.vibrate){ try { navigator.vibrate(8); } catch(e){} }
      });
      topicsEl.appendChild(b);
    })(TOPIC_ORDER[i]);
  }
}

function setTopic(key, manual){
  currentTopic = key;
  var chips = topicsEl.querySelectorAll('.chip');
  for (var i = 0; i < chips.length; i++){
    if (chips[i].getAttribute('data-topic') === key) chips[i].classList.add('on');
    else chips[i].classList.remove('on');
  }
  if (manual) topicsLabel.textContent = '已选择：' + TOPICS[key].label + '（点其他可切换）';
}

function onInput(){
  if (manualTopic) return;
  var q = input.value.trim();
  var r = detectTopic(q);
  if (r.hits > 0){
    setTopic(r.topic, false);
    topicsLabel.textContent = '识别到「' + TOPICS[r.topic].label + '」· 不对可手动改';
  } else {
    setTopic('general', false);
    topicsLabel.textContent = q ? '没识别出话题，用「通用」· 也可手动选' : '这个问题属于…（自动识别，可手动改）';
  }
}

input.addEventListener('input', onInput);
input.addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ input.blur(); draw(); }
});

/* =========================================================
   7. 抽牌
   ========================================================= */
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function draw(){
  if (busy) return;
  busy = true;
  btnDraw.disabled = true;

  var q = (input.value || '').trim();

  if (!manualTopic){
    var det = detectTopic(q);
    setTopic(det.topic, false);
    if (det.hits > 0) topicsLabel.textContent = '识别到「' + TOPICS[det.topic].label + '」· 不对可手动改';
  }

  var topic = TOPICS[currentTopic];
  var c = DECK[Math.floor(Math.random() * DECK.length)];
  var reversed = Math.random() < REVERSED_RATE;

  /* 关键：答案从「本话题 + 本正逆位」的库里抽 */
  var bank = reversed ? topic.rev : topic.up;
  var answer = pick(bank);

  result.classList.remove('show');
  card.classList.remove('flipped');
  frontInner.classList.remove('rev');
  card.classList.add('shuffling');

  if (navigator.vibrate){ try { navigator.vibrate(12); } catch(e){} }

  setTimeout(function(){
    $('fNum').textContent  = c.n;
    $('fNum2').textContent = c.n;
    $('fSym').textContent  = c.sym;
    $('fName').textContent = c.name;
    $('fEn').textContent   = c.en;
    if (reversed) frontInner.classList.add('rev');

    card.classList.remove('shuffling');
    card.classList.add('flipped');

    /* ---- 结果 ---- */
    $('rQ').textContent = q ? '你的问题：' + q : '你没有写下问题，这张牌就当作当下的提示。';

    $('rName').textContent = c.name + ' · ' + c.en;
    $('rKw').textContent   = '牌面关键词：' + c.kw;
    $('rCardText').textContent = reversed ? c.rev : c.up;

    var badge = $('rOrient');
    badge.textContent = reversed ? '逆位' : '正位';
    badge.className = 'badge' + (reversed ? ' rev' : '');

    $('aLabel').textContent = '🎯 针对你的问题 · ' + topic.icon + ' ' + topic.label;
    $('aText').textContent  = answer;
    $('aMeta').textContent  = '从「' + topic.label + ' · ' + (reversed ? '逆位' : '正位') +
                              '」答案库的 ' + bank.length + ' 条中随机抽取';

    setTimeout(function(){
      result.classList.add('show');
      busy = false;
      btnDraw.disabled = false;
    }, 520);
  }, 640);
}

btnDraw.addEventListener('click', draw);
btnAgain.addEventListener('click', draw);

/* =========================================================
   8. 启动
   ========================================================= */
buildChips();
setTopic('general', false);
</script>
</body>
</html>
